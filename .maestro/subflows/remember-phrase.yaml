appId: com.noirwire.app
---
# Reveals the phrase and keeps every word in output.words, by position.
- tapOn: "Reveal phrase"
- runFlow:
    when:
      visible: "Word 1, .*"
    commands:
      - copyTextFrom: "Word 1, .*"
      - runScript: ../scripts/remember-words.js
