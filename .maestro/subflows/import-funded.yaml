appId: com.noirwire.app
---
# Imports the funded test wallet named by FUNDED_PHRASE (see README).
- runFlow: launch-fresh.yaml
- tapOn: "Restore a wallet"
- tapOn: "Recovery phrase"
- inputText: "${FUNDED_PHRASE}"
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Where did this phrase come from?"
    # The form stays up with Continue disabled and the top loader running while it looks; a slow device takes a while.
    timeout: 180000
- tapOn: "NoirWire\\..*"
- tapOn: "Open this wallet"
- tapOn: "Continue"
- runFlow: set-password.yaml
