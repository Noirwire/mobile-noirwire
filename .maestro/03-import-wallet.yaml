appId: com.noirwire.app
env:
  PASSWORD: harbor-velvet-orbit-canyon-meadow
  # Made for tests alone. It has never held anything and must never be funded.
  TEST_PHRASE: style report excuse fitness region hour enroll honey broccoli already surge leisure
name: Import a wallet from a recovery phrase
tags:
  - onboarding
---
- runFlow: subflows/launch-fresh.yaml
- tapOn: "Restore a wallet"
- tapOn: "Recovery phrase"
- inputText: "${TEST_PHRASE}"
- hideKeyboard
- tapOn: "Continue"
- assertVisible: "Checking what this phrase holds.*"
- extendedWaitUntil:
    # Nothing is found for this phrase, so there is no choice of addresses: the result says it opens a new, empty wallet.
    visible: "Nothing found yet. This phrase will open a new, empty wallet."
    # The form stays up with Continue disabled and the top loader running while it looks; a slow device takes a while.
    timeout: 180000
- tapOn: "Continue"
- runFlow: subflows/set-password.yaml
- assertVisible: "Add money"
