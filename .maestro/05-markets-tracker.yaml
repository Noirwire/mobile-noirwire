appId: com.noirwire.app
env:
  PASSWORD: harbor-velvet-orbit-canyon-meadow
name: Markets leads to a tracker and its buy sheet
tags:
  - markets
---
- runFlow: subflows/launch-fresh.yaml
- runFlow: subflows/create-wallet.yaml
- tapOn: "Markets"
- tapOn: "Search trackers"
- inputText: "nvda"
- hideKeyboard
- tapOn: "NVIDIA, NVDAx.*"
- assertVisible: "Historical prices · Jupiter"
- tapOn: "1W"
- tapOn: "Buy"
- assertVisible: "Buy NVIDIA tracker"
