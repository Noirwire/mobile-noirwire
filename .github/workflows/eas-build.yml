name: EAS build

# A version tag (v0.2.0) builds both store binaries with the production
# profile. A manual run builds the internal preview (an installable iOS build
# for registered devices and an Android APK a Solana phone can sideload).
# Both need the EXPO_TOKEN repository secret; without it the build job is
# skipped with a notice and nothing is sent to Expo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, android, ios]
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  token:
    name: Check for EXPO_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=EAS build skipped::Set the EXPO_TOKEN repository secret (an Expo access token) to build with EAS."
          fi

  build:
    name: Build (${{ github.event_name == 'push' && 'production' || 'preview' }})
    needs: [ci, token]
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - name: Start the EAS build
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
